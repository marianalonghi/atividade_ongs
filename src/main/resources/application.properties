spring.application.name=atividade-ongs

# ------------------------------------------------------------------
# PostgreSQL
# Crie o banco antes de subir a aplicação:
#   CREATE DATABASE atividade_ongs;
# Os valores abaixo podem ser sobrescritos por variáveis de ambiente.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atividade_ongs}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------
# JPA / Hibernate
# update = cria/atualiza as tabelas automaticamente a partir das entidades.
# Em produção troque para "validate" e use Flyway/Liquibase para migrações.
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
